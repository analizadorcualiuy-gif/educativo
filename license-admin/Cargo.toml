[package]
name = "analizador-license-admin"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
analizador-license-core = { path = "../license-core" }
aes-gcm = "0.11.0"
argon2 = "0.5.3"
base64 = "0.22.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.1"
serde_json = "1.0"
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
zeroize = "1.9.0"
