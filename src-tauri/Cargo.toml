[package]
name = "analizador_cuali_uy_pro"
version = "1.0.0"
description = "AnalizadorCualiUY Pro - Edición comercial de escritorio para análisis cualitativo local"
authors = ["Prof. Esp. Santiago Hernández"]
edition = "2021"
license = "LicenseRef-Proprietary"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
pdf-extract = "0.12"
quick-xml = "0.41"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
